apiVersion: v1
kind: Pod
metadata:
  name: limited-pod
  namespace: dev-namespace
spec:
  containers:
  - name: limited-pod
    image: busybox
    command: ["sh", "-c", "echo Hello Kubernetes! && sleep 3600"]
    resources:
      requests:
        memory: "64Mi"
        cpu: "150m"
      limits:
        memory: "128Mi"
        cpu: "300m"
    
    ports:
      - containerPort: 80
