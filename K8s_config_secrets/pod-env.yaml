apiVersion: v1
kind: Pod
metadata:
  name: my-pod

spec:
  containers:
  - name: myapp
    image: busybox
    command: ['sh', '-c', 'sleep 3600']
    resources:
      limits:
        memory: "128Mi"
        cpu: "500m"
      requests:
        memory: "64Mi"
        cpu: "250m"
    ports:
      - containerPort: 80
    envFrom:
      - configMapRef:
          name: my-config
      - secretRef:
          name: my-secret